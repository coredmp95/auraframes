[project]
name = "auraframes"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "httpx[http2]>=0.27",
    "h2>=4",
    "requests>=2.31",
    "boto3>=1.34",
    "botocore>=1.34",
    "Pillow>=10.4",
    "piexif>=1.1.3",
    "geopy>=2.4",
    "loguru>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
